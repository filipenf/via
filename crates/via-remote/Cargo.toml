[package]
name = "via-remote"
version = "0.10.0"
edition = "2024"
rust-version = "1.86"
description = "Standalone remote execution helper for via (detachable PTY sessions over a Unix control socket)."

[lib]
name = "via_remote"
path = "src/lib.rs"

[[bin]]
name = "via-remote"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
crossbeam-channel = "0.5.15"
ciborium = "0.2.2"
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
tracing = "0.1.41"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

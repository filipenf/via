[package]
name = "via"
version = "0.12.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive"] }
# `wayland-data-control`: on Linux Wayland, the default X11 clipboard path often sees an empty
# clipboard when copying from native Wayland apps; this enables the wl-clipboard protocol instead.
arboard = { version = "3", features = ["wayland-data-control"] }
crossbeam-channel = "0.5.15"
cosmic-text = "0.19.0"
# Vendored terminal engine (Ghostty VT core) built via Zig at compile time.
# First clean builds are slow (git checkout of ghostty sources + Zig compile of the
# static vt lib). Results are cached under target/. Requires Zig 0.15.2 + git on PATH.
# See CONTRIBUTING.md "Build requirements" and the release workflow for the full
# list of system -dev packages needed on Linux.
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "5ac47e9eb166add2c00c432bc65c279133629712", features = [
  "link-static",
] }
nvim-rs = { version = "0.9.2", features = ["use_tokio"] }
portable-pty = "0.9.0"
crossterm = "0.28"
# Pinned to 0.29 to match xai-org/grok-build UI crates (textarea/markdown/inline).
# via's ratatui surface is small (acp_tui + acp_modal); grok leaf crates pin 0.29
# and do not type-unify across a dual 0.29/0.30 graph. See Obsidian
# `Spike — ACP TUI grok UI crates (PTY path)`.
ratatui = { version = "0.29", default-features = false, features = [
  "crossterm",
  # Required by xai-ratatui-textarea WidgetRef / StatefulWidgetRef.
  "unstable-widget-ref",
] }
# Leaf UI crates from grok-build (Apache-2.0). Git pin of xai-org only — not
# SylphxAI/spiron republishes. Requires ratatui 0.29 type unification
# (see Obsidian `Spike — ACP TUI grok UI crates (PTY path)`).
xai-ratatui-textarea = { git = "https://github.com/xai-org/grok-build", rev = "393430ee4934bc791b0d538f304a21691c517433", package = "xai-ratatui-textarea" }
xai-grok-markdown = { git = "https://github.com/xai-org/grok-build", rev = "393430ee4934bc791b0d538f304a21691c517433", package = "xai-grok-markdown" }
xai-ratatui-inline = { git = "https://github.com/xai-org/grok-build", rev = "393430ee4934bc791b0d538f304a21691c517433", package = "xai-ratatui-inline" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
toml = "0.9"
softbuffer = "0.4"
tokio = { version = "1.48.0", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
winit = { version = "0.30", features = ["wayland", "x11"] }
# ratatui 0.29 pins `unicode-width = "=0.2.0"`; keep in lockstep.
unicode-width = "=0.2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
agent-client-protocol = "2"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "links"
harness = false
